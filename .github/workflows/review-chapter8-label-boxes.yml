name: Review Chapter 8 label-box candidates

on:
  push:
    branches:
      - fix/geometry-aware-two-line-ocr
    paths:
      - ".github/workflows/review-chapter8-label-boxes.yml"
      - "tools/render_chapter8_label_boxes.py"
      - "tools/tests/test_chapter8_candidate_review.py"
      - "app/src/main/assets/stages/chapter_8_label_boxes.candidates.json"
      - "app/src/main/assets/stages/chapter_8.json"
      - "app/src/main/assets/stages/item_catalogs.json"
      - "reference/chapter_08/UPLOAD_HERE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install opencv-python-headless==4.10.0.84
      - name: Download the original Chapter 8 reference pair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference/chapter_08
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://img.atwiki.jp/eden_jp/attach/46/155/%E7%AC%AC8%E7%AB%A0.jpeg" \
            -o reference/chapter_08/annotated.jpg
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://img.atwiki.jp/eden_jp/attach/46/152/%E7%AC%AC8%E7%AB%A0%E7%84%A1%E5%8A%A0%E5%B7%A5.jpeg" \
            -o reference/chapter_08/base.jpg
          echo "5a856136e315f72fb9a490f01e2543603968229af26e99ef8230b0d6c9f92043  reference/chapter_08/annotated.jpg" | sha256sum --check -
          echo "2aa5632837d273242d44637944615cfce88f653ed6ca402f7bea28910b7734c5  reference/chapter_08/base.jpg" | sha256sum --check -
          python - <<'PY'
          from pathlib import Path
          import cv2
          expected = (2144, 1206)
          for name in ("annotated.jpg", "base.jpg"):
              path = Path("reference/chapter_08") / name
              assert path.read_bytes()[:2] == bytes.fromhex("ffd8"), f"{name}: not JPEG"
              image = cv2.imread(str(path), cv2.IMREAD_COLOR)
              assert image is not None, f"{name}: could not decode"
              assert image.shape[:2] == expected, f"{name}: unexpected dimensions {image.shape[:2]}"
          PY
      - name: Run coordinate and catalog tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
          python tools/validate_ocr_catalogs.py
          python tools/validate_stage_datasets.py
      - name: Render annotated/base coordinate comparison
        run: python tools/render_chapter8_label_boxes.py
      - name: Upload Chapter 8 reference and review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chapter8-label-box-review
          path: |
            reference/chapter_08/annotated.jpg
            reference/chapter_08/base.jpg
            reference/chapter_08/label_box_candidates.jpg
            reference/chapter_08/label_box_comparison.jpg
            app/src/main/assets/stages/chapter_8_label_boxes.candidates.json
          if-no-files-found: error
          retention-days: 14
