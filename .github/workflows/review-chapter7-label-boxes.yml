name: Review Chapter 7 label-box candidates

on:
  push:
    branches:
      - fix/geometry-aware-two-line-ocr
    paths:
      - ".github/workflows/review-chapter7-label-boxes.yml"
      - "tools/detect_chapter7_label_boxes.py"
      - "tools/tests/test_chapter7_label_frame_detection.py"
      - "reference/chapter_07/annotated.jpg"
      - "reference/chapter_07/base.jpg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install opencv-python-headless==4.10.0.84
      - name: Run Chapter 7 detector tests
        run: python -m unittest tools/tests/test_chapter7_label_frame_detection.py -v
      - name: Extract review-only components
        run: |
          python tools/detect_chapter7_label_boxes.py
          python tools/validate_ocr_catalogs.py
          python tools/validate_stage_datasets.py
      - name: Upload Chapter 7 review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chapter7-label-frame-review
          path: |
            reference/chapter_07/label_frame_components.candidates.json
            reference/chapter_07/label_frame_components_preview.jpg
          if-no-files-found: error
          retention-days: 14
