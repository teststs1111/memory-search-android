name: Create Chapter 1 coordinate grid

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/chapter1-coordinate-grid.yml"
      - "tools/create_chapter1_grid.py"
      - "reference/chapter_01/base.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install opencv-python-headless==4.10.0.84
      - name: Generate normalized coordinate grid
        run: python tools/create_chapter1_grid.py
      - name: Commit diagnostic images and registration report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/chapter_01/base_grid.jpg reference/chapter_01/left_registered_check.jpg reference/chapter_01/right_registered_check.jpg reference/chapter_01/registration_report.txt
          if git diff --cached --quiet; then
            echo "Coordinate grid is already up to date."
            exit 0
          fi
          git commit -m "Add Chapter 1 coordinate grid reference"
          git push origin HEAD:main
