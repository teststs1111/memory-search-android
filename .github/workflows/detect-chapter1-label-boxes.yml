name: Detect Chapter 1 annotation label boxes

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/detect-chapter1-label-boxes.yml"
      - "tools/detect_chapter1_label_boxes.py"
      - "reference/chapter_01/base.jpg"
      - "reference/chapter_01/left.jpg"
      - "reference/chapter_01/right.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing and Japanese OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
          python -m pip install opencv-python-headless==4.10.0.84
      - name: Detect and transform label rectangles
        run: python tools/detect_chapter1_label_boxes.py
      - name: Commit diagnostic preview
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/chapter_01/label_box_candidates.jpg reference/chapter_01/label_box_candidates.json
          if git diff --cached --quiet; then
            echo "Label box preview is already up to date."
            exit 0
          fi
          git commit -m "Detect Chapter 1 annotation label boxes"
          git push origin HEAD:main
