name: Prepare Chapter 1 combined reference

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/prepare-chapter1-reference.yml"
      - "tools/prepare_chapter1.py"
      - "reference/chapter_01/left.jpg"
      - "reference/chapter_01/right.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stitch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install opencv-python-headless==4.10.0.84
      - name: Create a side-by-side annotated reference sheet
        run: python tools/prepare_chapter1.py
      - name: Commit combined image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/chapter_01/annotated_pair.jpg
          if git diff --cached --quiet; then
            echo "Combined image is already up to date."
            exit 0
          fi
          git commit -m "Add aligned Chapter 1 annotated reference"
          git push origin HEAD:main
