name: Validate geometry-aware OCR branch

on:
  push:
    branches:
      - fix/geometry-aware-two-line-ocr
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate OCR catalogs
        run: python3 tools/validate_ocr_catalogs.py
      - name: Validate stage datasets
        run: python3 tools/validate_stage_datasets.py
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: memory-search-android-debug-geometry-ocr
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
