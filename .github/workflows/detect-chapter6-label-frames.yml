name: Detect Chapter 6 label frames

on:
  push:
    branches: [ fix/geometry-aware-two-line-ocr ]
    paths:
      - ".github/workflows/detect-chapter6-label-frames.yml"
      - "tools/detect_label_frames.py"
      - "tools/ocr_reference_labels.py"
      - "tools/tests/test_detect_label_frames.py"
      - "tools/tests/test_ocr_reference_labels.py"
      - "tools/tests/test_chapter6_candidate_review.py"
      - "app/src/main/assets/stages/chapter_6_label_boxes.candidates.json"
      - "reference/chapter_06/annotated.jpg"
      - "reference/chapter_06/base.jpg"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenCV and Japanese OCR
        run: |
          python -m pip install opencv-python-headless==4.10.0.84
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
      - name: Run detector and candidate-review unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Validate paired Chapter 6 reference images
        run: |
          set -euo pipefail
          test -f reference/chapter_06/annotated.jpg
          test -f reference/chapter_06/base.jpg
          python - <<'PY'
          from pathlib import Path
          for name in ("annotated.jpg", "base.jpg"):
              path = Path("reference/chapter_06") / name
              assert path.read_bytes()[:2] == bytes.fromhex("ffd8"), f"{path} is not JPEG"
          PY
      - name: Detect label backing rectangles
        run: |
          set -euo pipefail
          python tools/detect_label_frames.py \
            --annotated reference/chapter_06/annotated.jpg \
            --base reference/chapter_06/base.jpg \
            --seeds app/src/main/assets/stages/chapter_6_label_boxes.candidates.json \
            --output reference/chapter_06/detected_label_frames.candidates.json \
            --preview reference/chapter_06/detected_label_frames_preview.jpg
      - name: Extract OCR text positions for comparison
        run: |
          set -euo pipefail
          python tools/ocr_reference_labels.py \
            --image reference/chapter_06/annotated.jpg \
            --base reference/chapter_06/base.jpg \
            --seeds app/src/main/assets/stages/chapter_6_label_boxes.candidates.json \
            --output reference/chapter_06/ocr_text_regions.json \
            --preview reference/chapter_06/ocr_text_regions_preview.jpg
      - name: Upload review-only diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: chapter6-label-frame-diagnostics
          path: |
            reference/chapter_06/detected_label_frames.candidates.json
            reference/chapter_06/detected_label_frames_preview.jpg
            reference/chapter_06/detected_label_frames_mask.png
            reference/chapter_06/ocr_text_regions.json
            reference/chapter_06/ocr_text_regions_preview.jpg
          if-no-files-found: error
          retention-days: 14
