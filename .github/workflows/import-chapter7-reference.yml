name: Import Chapter 7 reference images

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/import-chapter7-reference.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download Chapter 7 annotated and unannotated images
        run: |
          set -euo pipefail
          mkdir -p reference/chapter_07
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://img.atwiki.jp/eden_jp/attach/46/154/%E7%AC%AC7%E7%AB%A0.jpeg' \
            --output reference/chapter_07/annotated.jpg
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://img.atwiki.jp/eden_jp/attach/46/150/%E7%AC%AC7%E7%AB%A0%E7%84%A1%E5%8A%A0%E5%B7%A5.jpeg' \
            --output reference/chapter_07/base.jpg
          for image in reference/chapter_07/annotated.jpg reference/chapter_07/base.jpg; do
            file "$image"
            test "$(od -An -tx1 -N2 "$image" | tr -d ' \n')" = "ffd8"
          done
      - name: Commit images to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/chapter_07/annotated.jpg reference/chapter_07/base.jpg
          if git diff --cached --quiet; then
            echo "Chapter 7 reference images are already up to date."
            exit 0
          fi
          git commit -m "Add Chapter 7 reference images"
          git push origin HEAD:main
