name: Render Chapter 6 label-box candidates

on:
  push:
    branches: [ fix/geometry-aware-two-line-ocr ]
    paths:
      - "reference/chapter_06/base.jpg"
      - "reference/chapter_06/annotated.jpg"
      - "app/src/main/assets/stages/chapter_6_label_boxes.candidates.json"
      - "tools/render_chapter6_label_boxes.py"
      - ".github/workflows/render-chapter6-label-boxes.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install opencv-python-headless==4.10.0.84
      - name: Render annotated/base comparison previews
        run: |
          set -euo pipefail
          test -f reference/chapter_06/base.jpg
          test -f reference/chapter_06/annotated.jpg
          python tools/render_chapter6_label_boxes.py
          test -f reference/chapter_06/label_box_candidates.jpg
          test -f reference/chapter_06/label_box_comparison.jpg
      - name: Upload comparison previews
        uses: actions/upload-artifact@v4
        with:
          name: chapter6-label-box-preview
          path: |
            reference/chapter_06/label_box_candidates.jpg
            reference/chapter_06/label_box_comparison.jpg
          if-no-files-found: error
          retention-days: 14
