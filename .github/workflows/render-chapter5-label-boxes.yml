name: Render Chapter 5 label-box candidates

on:
  push:
    branches: [ main ]
    paths:
      - "reference/chapter_05/base.jpg"
      - "app/src/main/assets/stages/chapter_5_label_boxes.candidates.json"
      - "tools/render_chapter5_label_boxes.py"
      - ".github/workflows/render-chapter5-label-boxes.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependency
        run: python -m pip install opencv-python-headless==4.10.0.84
      - name: Render draft label-frame rectangles
        run: |
          if [ ! -f reference/chapter_05/base.jpg ]; then
            echo "Chapter 5 base.jpg has not been uploaded; preview generation is deferred."
            exit 0
          fi
          python tools/render_chapter5_label_boxes.py
      - name: Commit preview image
        run: |
          set -euo pipefail
          if [ ! -f reference/chapter_05/label_box_candidates.jpg ]; then
            echo "No preview was generated; nothing to commit."
            exit 0
          fi
          git add reference/chapter_05/label_box_candidates.jpg
          if git diff --cached --quiet; then
            echo "Preview is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render Chapter 5 draft label-box preview"
          git push origin HEAD:main
