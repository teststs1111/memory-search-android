name: Detect Chapter 5 label frames

on:
  push:
    branches: [ fix/geometry-aware-two-line-ocr ]
    paths:
      - ".github/workflows/detect-chapter5-label-frames.yml"
      - "tools/detect_label_frames.py"
      - "tools/ocr_reference_labels.py"
      - "tools/tests/test_detect_label_frames.py"
      - "tools/tests/test_ocr_reference_labels.py"
      - "app/src/main/assets/stages/chapter_5_label_boxes.candidates.json"
      - "reference/chapter_05/base.jpg"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenCV and Japanese OCR
        run: |
          python -m pip install opencv-python-headless==4.10.0.84
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn
      - name: Run detector and OCR unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Download Chapter 5 annotated reference
        run: |
          set -euo pipefail
          mkdir -p reference/chapter_05
          curl --fail --location --retry 3 --retry-delay 2 'https://img.atwiki.jp/eden_jp/attach/46/125/%E7%AC%AC5%E7%AB%A0.jpeg' --output reference/chapter_05/annotated.jpg
          python -c "from pathlib import Path; p=Path('reference/chapter_05/annotated.jpg'); assert p.read_bytes()[:2] == bytes.fromhex('ffd8')"
      - name: Detect label backing rectangles
        run: |
          set -euo pipefail
          python tools/detect_label_frames.py \
            --annotated reference/chapter_05/annotated.jpg \
            --base reference/chapter_05/base.jpg \
            --seeds app/src/main/assets/stages/chapter_5_label_boxes.candidates.json \
            --output reference/chapter_05/detected_label_frames.candidates.json \
            --preview reference/chapter_05/detected_label_frames_preview.jpg
      - name: Extract OCR text positions for comparison
        run: |
          set -euo pipefail
          python tools/ocr_reference_labels.py \
            --image reference/chapter_05/annotated.jpg \
            --base reference/chapter_05/base.jpg \
            --seeds app/src/main/assets/stages/chapter_5_label_boxes.candidates.json \
            --output reference/chapter_05/ocr_text_regions.json \
            --preview reference/chapter_05/ocr_text_regions_preview.jpg
      - name: Upload review-only detection results
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-label-frame-diagnostics
          path: |
            reference/chapter_05/detected_label_frames.candidates.json
            reference/chapter_05/detected_label_frames_preview.jpg
            reference/chapter_05/detected_label_frames_mask.png
            reference/chapter_05/ocr_text_regions.json
            reference/chapter_05/ocr_text_regions_preview.jpg
          if-no-files-found: error
          retention-days: 14
