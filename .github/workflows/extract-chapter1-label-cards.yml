name: Extract Chapter 1 label cards from image differences

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/extract-chapter1-label-cards.yml"
      - "tools/extract_chapter1_label_cards.py"
      - "reference/chapter_01/base.jpg"
      - "reference/chapter_01/left.jpg"
      - "reference/chapter_01/right.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenCV
        run: python -m pip install opencv-python-headless==4.10.0.84 numpy
      - name: Register images and extract dark label cards
        run: python tools/extract_chapter1_label_cards.py
      - name: Commit diagnostic outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/chapter_01/label_box_candidates.jpg reference/chapter_01/label_box_candidates.json reference/chapter_01/source_label_box_check.jpg
          if git diff --cached --quiet; then
            echo "No changes in extracted label cards."
            exit 0
          fi
          git commit -m "Extract Chapter 1 label cards from image differences"
          git push origin HEAD:main
